name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Живая база для тестов, которым нужна настоящая: изоляция арендаторов и
    # гонка за пост в расписании. Без неё эти тесты пришлось бы пропускать, а
    # пропущенный тест изоляции хуже отсутствующего — он создаёт ощущение
    # проверки. Версия та же, что в бою.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geleoteka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        env:
          # prisma.config.ts:14 calls env("DATABASE_URL") which throws when unset.
          # `prisma generate` only reads the schema and never connects, so any
          # non-empty value satisfies the env() resolver.
          DATABASE_URL: postgresql://prisma-generate-stub:stub@localhost:5432/stub
        # Required so tsc can resolve `@/app/generated/prisma/client` imports.
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Тесты не запускались в CI вовсе — почти тысяча проверок существовала,
      # но мерж ими не гейтился, и всё держалось на том, что автор прогонит их
      # у себя. Теперь гейт настоящий.
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geleoteka_test
        run: npm test

      # Note: `verify-vehicle-trims` is NOT run here — it requires a live
      # DATABASE_URL. Run manually before deploy. A future scheduled workflow
      # against a staging DB could close this gap.
      # `npm run build` is also skipped — Next.js cold build is ~2 min and
      # tsc + lint catch most issues for a per-PR gate.
